<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .pulse {
        animation: pulse 3s ease-in-out infinite;
      }
      .float {
        animation: float 4s ease-in-out infinite;
      }
      .float-delay {
        animation: float 4s ease-in-out infinite;
        animation-delay: 2s;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="#00d4ff" opacity="0.1" class="pulse"/>
  <circle cx="1100" cy="300" r="80" fill="#0099ff" opacity="0.1" class="pulse"/>
  <circle cx="600" cy="200" r="150" fill="#00d4ff" opacity="0.05"/>

  <!-- Data flow lines -->
  <path d="M 50 350 Q 300 300 400 200 T 600 150 T 800 200 T 1150 350" stroke="url(#accentGradient)" stroke-width="2" fill="none" opacity="0.3" class="float"/>
  <path d="M 50 370 Q 300 320 400 220 T 600 170 T 800 220 T 1150 370" stroke="#00d4ff" stroke-width="1" fill="none" opacity="0.2" class="float-delay"/>

  <!-- Car icon representation -->
  <g transform="translate(900, 80)" class="float">
    <rect x="0" y="20" width="120" height="40" rx="10" fill="#00d4ff" opacity="0.8" filter="url(#glow)"/>
    <rect x="20" y="5" width="60" height="25" rx="5" fill="#00d4ff" opacity="0.6"/>
    <circle cx="25" cy="65" r="12" fill="#0099ff"/>
    <circle cx="95" cy="65" r="12" fill="#0099ff"/>
    <circle cx="25" cy="65" r="6" fill="#1a1a2e"/>
    <circle cx="95" cy="65" r="6" fill="#1a1a2e"/>
  </g>

  <!-- Main title -->
  <text x="600" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" filter="url(#glow)">
    Awesome Usage-Based Insurance
  </text>

  <!-- Subtitle -->
  <text x="600" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#00d4ff" opacity="0.9">
    Telematics • Driver Analytics • Risk Scoring
  </text>

  <!-- Tagline -->
  <text x="600" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" opacity="0.7">
    Open-Source Projects & SaaS Platforms for Modern Insurance
  </text>

  <!-- Status indicator -->
  <g transform="translate(50, 360)">
    <circle cx="10" cy="10" r="8" fill="#00ff88" class="pulse"/>
    <text x="25" y="15" font-family="Arial, sans-serif" font-size="14" fill="#00ff88">
      Community Curated
    </text>
  </g>

  <!-- Version/Date -->
  <text x="1150" y="380" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" opacity="0.5">
    Updated: August 2026
  </text>
</svg>